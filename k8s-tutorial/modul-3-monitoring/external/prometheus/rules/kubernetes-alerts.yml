# Peraturan alert untuk bengkel. Label severity: warning | critical
# digunakan oleh Alertmanager untuk menghala ke Email / Slack / Teams.
groups:
  - name: kubernetes-pods
    rules:
      - alert: PodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total[10m]) > 3
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} crash-looping"
          description: "Container {{ $labels.container }} restart {{ $value | humanize }} kali dalam 10 minit."

      - alert: PodNotReady
        expr: sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} tidak Running lebih 5 minit"

      - alert: ContainerOOMKilled
        expr: |
          (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1)
          and on (namespace, pod, container)
          kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} OOMKilled"
          description: "Naikkan limits.memory atau siasat memory leak."

      - alert: ContainerMemoryNearLimit
        expr: |
          sum by (namespace, pod, container) (container_memory_working_set_bytes{container!=""})
          / sum by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"}) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} guna {{ $value | humanizePercentage }} daripada limit memori"

      - alert: CPUThrottlingHigh
        expr: |
          sum by (namespace, pod, container) (increase(container_cpu_cfs_throttled_periods_total{container!=""}[5m]))
          / sum by (namespace, pod, container) (increase(container_cpu_cfs_periods_total{container!=""}[5m])) > 0.25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} di-throttle {{ $value | humanizePercentage }}"

      - alert: DeploymentReplicasMismatch
        expr: kube_deployment_spec_replicas != kube_deployment_status_replicas_available
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} tidak capai bilangan replicas"

  - name: kubernetes-hpa
    rules:
      - alert: HPAMaxedOut
        expr: |
          kube_horizontalpodautoscaler_status_current_replicas
          >= kube_horizontalpodautoscaler_spec_max_replicas
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HPA {{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler }} pada maxReplicas selama 5 minit"
          description: "Kapasiti autoscaling habis. Pertimbangkan naikkan maxReplicas atau optimumkan app."

      - alert: HPAReplicasMismatch
        expr: |
          kube_horizontalpodautoscaler_status_desired_replicas
          != kube_horizontalpodautoscaler_status_current_replicas
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "HPA {{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler }} tidak dapat capai desired replicas"
          description: "Kemungkinan ResourceQuota habis atau pod Pending (node penuh)."

  - name: kubernetes-nodes
    rules:
      - alert: NodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.node }} NotReady"

      - alert: NodeHighCPU
        expr: 1 - avg by (node) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU node {{ $labels.node }} {{ $value | humanizePercentage }}"

      - alert: NodeMemoryHigh
        expr: 1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes > 0.9
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Memori node {{ $labels.node }} {{ $value | humanizePercentage }}"

      - alert: NodeDiskAlmostFull
        expr: |
          1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk {{ $labels.mountpoint }} pada {{ $labels.node }} {{ $value | humanizePercentage }} penuh"

  - name: monitoring-pipeline
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Target {{ $labels.job }} ({{ $labels.instance }}) tidak dapat di-scrape"

  - name: demo-app
    rules:
      - alert: DemoAppHighErrorRate
        expr: |
          sum by (namespace) (rate(demo_http_requests_total{code=~"5.."}[2m]))
          / sum by (namespace) (rate(demo_http_requests_total[2m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Kadar ralat 5xx demo-app {{ $value | humanizePercentage }}"
