# Prometheus LUAR untuk Pilihan B: kluster MENOLAK metrik melalui remote_write (Prometheus Agent
# dalam Modul 3, atau OpenTelemetry Collector dalam Modul 5), jadi Prometheus luar tidak lagi scrape
# kluster. Hanya job "prometheus" kekal. Token/CA (prometheus/k8s/) tidak diperlukan.
# Peraturan alert dan Alertmanager sama seperti Pilihan A, kerana nama metrik dan label job tidak berubah.
# Penerima remote_write dihidupkan oleh --web.enable-remote-write-receiver dalam docker-compose.yml.
# Guna (dalam modul-3-monitoring/external):
#   cp prometheus/prometheus.yml prometheus/prometheus.yml.asal
#   cp prometheus/prometheus-pilihan-b.yml prometheus/prometheus.yml
#   curl -X POST localhost:9090/-/reload
# Pulihkan Pilihan A: cp prometheus/prometheus.yml.asal prometheus/prometheus.yml && curl -X POST localhost:9090/-/reload
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: lab

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
