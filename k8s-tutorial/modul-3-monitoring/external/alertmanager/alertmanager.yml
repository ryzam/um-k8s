# Penghalaan alert:
#   semua alert            -> email (Mailpit dalam makmal: http://localhost:8025)
#   severity="critical"    -> Slack + Microsoft Teams juga
# Gantikan URL webhook GANTI-... dengan nilai sebenar (lihat README Modul 3).
global:
  resolve_timeout: 5m
  smtp_smarthost: mailpit:1025
  smtp_from: alertmanager@bengkel.local
  smtp_require_tls: false        # Mailpit tiada TLS. Untuk SMTP sebenar (cth: Office 365) set true + auth

route:
  receiver: email-pasukan
  group_by: [alertname, namespace]
  group_wait: 30s                # tunggu 30s untuk kumpul alert serupa dalam satu notifikasi
  group_interval: 2m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: slack-oncall
      continue: true             # teruskan supaya route berikutnya juga dipadankan
    - matchers: [severity="critical"]
      receiver: teams-oncall
      continue: true
    - matchers: [severity=~"critical|warning"]
      receiver: email-pasukan

inhibit_rules:
  # Jika alert yang sama sudah critical, jangan hantar versi warning untuk namespace yang sama
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, namespace]

receivers:
  - name: email-pasukan
    email_configs:
      - to: devops@bengkel.local
        send_resolved: true

  - name: slack-oncall
    slack_configs:
      - api_url: https://hooks.slack.com/services/GANTI/DENGAN/WEBHOOK
        channel: "#k8s-alerts"
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}*{{ .Labels.severity }}* {{ .Annotations.summary }}
          {{ if .Annotations.description }}{{ .Annotations.description }}{{ end }}
          {{ end }}

  - name: teams-oncall
    # msteamsv2 = integrasi Teams melalui Workflows (Power Automate).
    # Connector "Incoming Webhook" Office 365 yang lama sedang ditamatkan oleh Microsoft.
    msteamsv2_configs:
      - webhook_url: https://GANTI.webhook.office.com/workflows/DENGAN-URL-WORKFLOW
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}. {{ end }}'
