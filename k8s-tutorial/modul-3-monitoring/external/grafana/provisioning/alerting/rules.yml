# Contoh peraturan alert yang diurus oleh Grafana (bukan Prometheus).
# Struktur: A = query Prometheus, C = syarat ambang. Alert firing jika C benar selama "for".
apiVersion: 1
groups:
  - orgId: 1
    name: bengkel-hpa
    folder: Bengkel K8s
    interval: 1m
    rules:
      - uid: grafana-hpa-maxed-out
        title: "[Grafana] HPA pada maxReplicas"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "HPA {{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler }} pada maxReplicas"
          __dashboardUid__: bengkel-k8s-hpa
          __panelId__: "15"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                kube_horizontalpodautoscaler_status_current_replicas
                - kube_horizontalpodautoscaler_spec_max_replicas
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gte, params: [0] }
      - uid: grafana-pod-restarts
        title: "[Grafana] Container restart berulang"
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} restart {{ $values.A }} kali dalam 10 minit"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total[10m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [3] }
