# GREEN = versi baharu (v2). Dideploy sepenuhnya SEBELUM menerima trafik.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-bg-green
  namespace: demo
  labels:
    app: demo-bg
    slot: green
spec:
  replicas: 3
  selector:
    matchLabels:
      app: demo-bg
      slot: green
  template:
    metadata:
      labels:
        app: demo-bg
        slot: green
        version: v2
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: app
          image: python:3.12-slim
          command: ["python", "-u", "/app/app.py"]
          env:
            - name: VERSION
              value: v2
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: demo-app-code
