# Service "live": selector slot menentukan warna mana yang terima trafik.
# Tukar: kubectl -n demo patch svc demo-bg -p '{"spec":{"selector":{"app":"demo-bg","slot":"green"}}}'
apiVersion: v1
kind: Service
metadata:
  name: demo-bg
  namespace: demo
spec:
  type: NodePort
  selector:
    app: demo-bg
    slot: blue
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30082
---
# Service "preview": sentiasa menunjuk ke GREEN supaya boleh diuji sebelum tukar
apiVersion: v1
kind: Service
metadata:
  name: demo-bg-preview
  namespace: demo
spec:
  selector:
    app: demo-bg
    slot: green
  ports:
    - name: http
      port: 80
      targetPort: http
