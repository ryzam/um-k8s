# KES 5: "Pod Pending selama-lamanya"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kes-5-ml
  namespace: troubleshoot
spec:
  replicas: 1
  selector:
    matchLabels: { app: kes-5-ml }
  template:
    metadata:
      labels: { app: kes-5-ml }
    spec:
      nodeSelector:
        accelerator: nvidia-gpu
      containers:
        - name: ml
          image: busybox:1.36
          command: ["sleep", "infinity"]
          resources:
            requests: { cpu: "64", memory: 128Gi }
