# KES 4: "Pod Running, tetapi Service tidak dapat dicapai"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kes-4-api
  namespace: troubleshoot
spec:
  replicas: 2
  selector:
    matchLabels: { app: kes-4-api }
  template:
    metadata:
      labels: { app: kes-4-api }
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kes-4-api
  namespace: troubleshoot
spec:
  selector:
    app: kes4-api
  ports:
    - port: 80
      targetPort: 8080
