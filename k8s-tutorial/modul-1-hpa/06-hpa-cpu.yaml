# HPA v2 - CPU sahaja.
# desiredReplicas = ceil( currentReplicas * currentUtilization / targetUtilization )
# Utilization = penggunaan CPU sebenar / requests.cpu (BUKAN limits)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: demo-app
  namespace: demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demo-app
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
