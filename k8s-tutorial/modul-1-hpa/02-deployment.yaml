# LANGKAH 2: Deployment dengan requests/limits dan probes.
#   requests -> apa yang scheduler "tempah" pada node & asas pengiraan HPA Utilization
#   limits   -> siling. CPU melebihi limit = throttled; memori melebihi limit = OOMKilled
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo
  labels:
    app: demo-app
spec:
  # JANGAN set replicas apabila HPA mengawal Deployment ini (elak "berlawan" dengan HPA
  # setiap kali kubectl apply). Nilai awal = 1, selepas itu HPA yang tentukan.
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: app
          image: python:3.12-slim
          command: ["python", "-u", "/app/app.py"]
          env:
            - name: VERSION
              value: v1
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m        # 0.1 vCPU
              memory: 64Mi
            limits:
              cpu: 500m        # boleh "burst" sehingga 0.5 vCPU
              memory: 256Mi    # lebih daripada ini -> OOMKilled
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: demo-app-code
