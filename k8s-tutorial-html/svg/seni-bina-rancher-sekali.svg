6 H558" class="arra" marker-end="url(#ssa)"/><text x="416" y="176" class="ta" text-anchor="middle">terus (tiada tunnel)</text><path d="M308,252 H558" class="arr dash"/><text x="434" y="244" class="ts" text-anchor="middle">pod pada node yang sama</text><rect x="48" y="318" width="260" height="52" rx="8" class="warn"/><text x="178.0" y="341.0" class="th" text-anchor="middle">Browser · kubectl --context local</text><text x="178.0" y="359.0" class="ts" text-anchor="middle">melalui Rancher (RBAC, audit)</text><path d="M48,344 H38 V116 H46" class="arr" marker-end="url(#ssh)"/><rect x="560" y="318" width="292" height="52" rx="8" class="warn"/><text x="706.0" y="341.0" class="th" text-anchor="middle">kubectl --context k3d-lab</text><text x="706.0" y="359.0" class="ts" text-anchor="middle">terus ke API server (admin)</text><path d="M852,344 H864 V116 H854" class="arr" marker-end="url(#ssh)"/></svg>