<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" role="img" aria-labelledby="rat rad"><title id="rat">Penghalaan Alertmanager</title><desc id="rad">Semua alert ke email-pasukan; alert severity critical ke slack-oncall, teams-oncall dan email-pasukan.</desc><style>svg{--d-zone:#f3f5f8;--d-zone2:#f8f6f1;--d-box:#ffffff;--d-line:#b9c2cf;--d-fg:#18202c;--d-muted:#5a6577;--d-acc:#2457c5;--d-accbg:#e6edfb;--d-warn:#b4540b;--d-warnbg:#fbeee2;--d-ok:#1f7a4d;--d-okbg:#e3f3ea;--d-arrow:#6b7688;--d-grid:#e1e5eb;--d-font:'IBM Plex Sans',system-ui,sans-serif;--d-mono:'IBM Plex Mono',ui-monospace,monospace}@media (prefers-color-scheme:dark){svg{--d-zone:#1a212c;--d-zone2:#211f1b;--d-box:#121821;--d-line:#3c4757;--d-fg:#e6eaf0;--d-muted:#9aa5b6;--d-acc:#7ea4ff;--d-accbg:#1d2a45;--d-warn:#f0a35e;--d-warnbg:#3a2717;--d-ok:#5fcf93;--d-okbg:#16301f;--d-arrow:#8b96a8;--d-grid:#2a3340}}
.zone{fill:var(--d-zone);stroke:var(--d-line);stroke-width:1.2}
.zone2{fill:var(--d-zone2);stroke:var(--d-line);stroke-width:1.2;stroke-dasharray:6 4}
.box{fill:var(--d-box);stroke:var(--d-line);stroke-width:1.2}
.acc{fill:var(--d-accbg);stroke:var(--d-acc);stroke-width:1.4}
.warn{fill:var(--d-warnbg);stroke:var(--d-warn);stroke-width:1.4}
.okb{fill:var(--d-okbg);stroke:var(--d-ok);stroke-width:1.4}
.solid{fill:var(--d-acc)}
.t{fill:var(--d-fg);font-size:14px}
.th{fill:var(--d-fg);font-size:14px;font-weight:600}
.ts{fill:var(--d-muted);font-size:12px}
.tl{fill:var(--d-muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.ta{fill:var(--d-acc);font-size:12px;font-weight:600}
.tw{fill:var(--d-warn);font-size:12px;font-weight:600}
.m{font-family:var(--d-mono)}
.arr{fill:none;stroke:var(--d-arrow);stroke-width:1.6}
.arra{fill:none;stroke:var(--d-acc);stroke-width:1.8}
.dash{stroke-dasharray:5 4}
.grid{stroke:var(--d-grid);stroke-width:1}
.area{fill:var(--d-accbg);stroke:var(--d-acc);stroke-width:2}
.head{fill:var(--d-arrow)}
.heada{fill:var(--d-acc)}
text{font-family:var(--d-font)}
</style><defs><marker id="rah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="raa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="heada"/></marker></defs><rect x="20" y="66" width="160" height="56" rx="8" class="box"/><text x="100.0" y="91.0" class="th" text-anchor="middle">Alert firing</text><text x="100.0" y="109.0" class="ts" text-anchor="middle">dari Prometheus</text><rect x="230" y="66" width="170" height="56" rx="8" class="acc"/><text x="315.0" y="91.0" class="th" text-anchor="middle">Alertmanager</text><text x="315.0" y="109.0" class="ts" text-anchor="middle">route tree</text><path d="M180,94 H228" class="arr" marker-end="url(#rah)"/><path d="M400,84 H460 V44 H498" class="arr" marker-end="url(#rah)"/><path d="M400,104 H460 V140 H498" class="arra" marker-end="url(#raa)"/><text x="452" y="38" class="ts m" text-anchor="end">semua alert</text><text x="452" y="150" class="ta m" text-anchor="end">severity="critical"</text><rect x="500" y="22" width="170" height="44" rx="8" class="okb"/><text x="585.0" y="49.0" class="t m" text-anchor="middle">email-pasukan</text><rect x="500" y="118" width="120" height="44" rx="8" class="okb"/><text x="560.0" y="145.0" class="ts m" text-anchor="middle">slack-oncall</text><rect x="630" y="118" width="120" height="44" rx="8" class="okb"/><text x="690.0" y="145.0" class="ts m" text-anchor="middle">teams-oncall</text><rect x="760" y="118" width="120" height="44" rx="8" class="okb"/><text x="820.0" y="145.0" class="ts m" text-anchor="middle">email-pasukan</text></svg>