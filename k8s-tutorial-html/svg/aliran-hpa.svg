<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="hpt hpd"><title id="hpt">Aliran keputusan HPA</title><desc id="hpd">kubelet menghantar metrik ke Metrics Server, HPA controller membaca metrics.k8s.io dan menskala Deployment setiap 15 saat.</desc><style>svg{--d-zone:#f3f5f8;--d-zone2:#f8f6f1;--d-box:#ffffff;--d-line:#b9c2cf;--d-fg:#18202c;--d-muted:#5a6577;--d-acc:#2457c5;--d-accbg:#e6edfb;--d-warn:#b4540b;--d-warnbg:#fbeee2;--d-ok:#1f7a4d;--d-okbg:#e3f3ea;--d-arrow:#6b7688;--d-grid:#e1e5eb;--d-font:'IBM Plex Sans',system-ui,sans-serif;--d-mono:'IBM Plex Mono',ui-monospace,monospace}@media (prefers-color-scheme:dark){svg{--d-zone:#1a212c;--d-zone2:#211f1b;--d-box:#121821;--d-line:#3c4757;--d-fg:#e6eaf0;--d-muted:#9aa5b6;--d-acc:#7ea4ff;--d-accbg:#1d2a45;--d-warn:#f0a35e;--d-warnbg:#3a2717;--d-ok:#5fcf93;--d-okbg:#16301f;--d-arrow:#8b96a8;--d-grid:#2a3340}}
.zone{fill:var(--d-zone);stroke:var(--d-line);stroke-width:1.2}
.zone2{fill:var(--d-zone2);stroke:var(--d-line);stroke-width:1.2;stroke-dasharray:6 4}
.box{fill:var(--d-box);stroke:var(--d-line);stroke-width:1.2}
.acc{fill:var(--d-accbg);stroke:var(--d-acc);stroke-width:1.4}
.warn{fill:var(--d-warnbg);stroke:var(--d-warn);stroke-width:1.4}
.okb{fill:var(--d-okbg);stroke:var(--d-ok);stroke-width:1.4}
.solid{fill:var(--d-acc)}
.t{fill:var(--d-fg);font-size:14px}
.th{fill:var(--d-fg);font-size:14px;font-weight:600}
.ts{fill:var(--d-muted);font-size:12px}
.tl{fill:var(--d-muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.ta{fill:var(--d-acc);font-size:12px;font-weight:600}
.tw{fill:var(--d-warn);font-size:12px;font-weight:600}
.m{font-family:var(--d-mono)}
.arr{fill:none;stroke:var(--d-arrow);stroke-width:1.6}
.arra{fill:none;stroke:var(--d-acc);stroke-width:1.8}
.dash{stroke-dasharray:5 4}
.grid{stroke:var(--d-grid);stroke-width:1}
.area{fill:var(--d-accbg);stroke:var(--d-acc);stroke-width:2}
.head{fill:var(--d-arrow)}
.heada{fill:var(--d-acc)}
text{font-family:var(--d-font)}
</style><defs><marker id="hph" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="hpa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="heada"/></marker></defs><rect x="20" y="40" width="160" height="64" rx="8" class="box"/><text x="100.0" y="69.0" class="th" text-anchor="middle">kubelet</text><text x="100.0" y="87.0" class="ts" text-anchor="middle">cAdvisor</text><rect x="250" y="40" width="170" height="64" rx="8" class="box"/><text x="335.0" y="69.0" class="th" text-anchor="middle">Metrics Server</text><text x="335.0" y="87.0" class="ts" text-anchor="middle">kube-system</text><rect x="490" y="40" width="170" height="64" rx="8" class="acc"/><text x="575.0" y="69.0" class="th" text-anchor="middle">HPA controller</text><text x="575.0" y="87.0" class="ts" text-anchor="middle">kube-controller-manager</text><rect x="730" y="40" width="150" height="64" rx="8" class="box"/><text x="805.0" y="69.0" class="th" text-anchor="middle">Deployment</text><text x="805.0" y="87.0" class="ts" text-anchor="middle">demo-app</text><path d="M180,72 H248" class="arr" marker-end="url(#hph)"/><text x="215.0" y="28" class="ts m" text-anchor="middle">/metrics/resource</text><path d="M420,72 H488" class="arr" marker-end="url(#hph)"/><text x="455.0" y="28" class="ts m" text-anchor="middle">metrics.k8s.io</text><path d="M660,72 H728" class="arra" marker-end="url(#hpa)"/><text x="695.0" y="28" class="ts m" text-anchor="middle">scale</text><path d="M805,104 V146 H100 V106" class="arr dash" marker-end="url(#hph)"/><text x="452" y="140" class="ts" text-anchor="middle">pod baharu → lebih banyak metrik; kitaran berulang setiap 15 s</text><rect x="20" y="172" width="860" height="112" rx="10" class="zone"/><text x="40" y="200" class="tl" text-anchor="start">Formula</text><text x="40" y="230" class="th m" text-anchor="start">desiredReplicas = ceil( currentReplicas × currentUtilization / targetUtilization )</text><text x="40" y="256" class="t" text-anchor="start">Contoh: 2 pod, sasaran 50%, purata 150%  →  ceil(2 × 150 / 50) = 6 pod</text><text x="40" y="276" class="ts" text-anchor="start">Toleransi 10% (nisbah 0.9–1.1 diabaikan) · scale-down ambil nilai tertinggi dalam stabilizationWindowSeconds</text></svg>