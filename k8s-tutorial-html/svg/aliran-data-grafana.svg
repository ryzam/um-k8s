<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="agt agd" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="agt">Aliran data dari exporter ke panel Grafana</title><desc id="agd">Prometheus tarik /metrics daripada kube-state-metrics, node-exporter, cAdvisor dan demo-app setiap 15 saat dan simpan dalam TSDB. Grafana tahu alamat Prometheus daripada fail provisioning datasources/prometheus.yml (url http://prometheus:9090) dan memuat dashboard JSON melalui provisioning/dashboards/provider.yml. Panel menghantar PromQL ke /api/v1/query_range, Prometheus menjawab JSON, dan Grafana melukis graf dalam pelayar.</desc><style>svg{--d-zone:#f3f5f8;--d-zone2:#f8f6f1;--d-box:#ffffff;--d-line:#b9c2cf;--d-fg:#18202c;--d-muted:#5a6577;--d-acc:#2457c5;--d-accbg:#e6edfb;--d-warn:#b4540b;--d-warnbg:#fbeee2;--d-ok:#1f7a4d;--d-okbg:#e3f3ea;--d-arrow:#6b7688;--d-grid:#e1e5eb;--d-font:'IBM Plex Sans',system-ui,sans-serif;--d-mono:'IBM Plex Mono',ui-monospace,monospace}@media (prefers-color-scheme:dark){svg{--d-zone:#1a212c;--d-zone2:#211f1b;--d-box:#121821;--d-line:#3c4757;--d-fg:#e6eaf0;--d-muted:#9aa5b6;--d-acc:#7ea4ff;--d-accbg:#1d2a45;--d-warn:#f0a35e;--d-warnbg:#3a2717;--d-ok:#5fcf93;--d-okbg:#16301f;--d-arrow:#8b96a8;--d-grid:#2a3340}}
