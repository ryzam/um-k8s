.zone2{fill:var(--d-zone2);stroke:var(--d-line);stroke-width:1.2;stroke-dasharray:6 4}
.box{fill:var(--d-box);stroke:var(--d-line);stroke-width:1.2}
.acc{fill:var(--d-accbg);stroke:var(--d-acc);stroke-width:1.4}
.warn{fill:var(--d-warnbg);stroke:var(--d-warn);stroke-width:1.4}
.okb{fill:var(--d-okbg);stroke:var(--d-ok);stroke-width:1.4}
.solid{fill:var(--d-acc)}
.t{fill:var(--d-fg);font-size:14px}
.th{fill:var(--d-fg);font-size:14px;font-weight:600}
.ts{fill:var(--d-muted);font-size:12px}
.tl{fill:var(--d-muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.ta{fill:var(--d-acc);font-size:12px;font-weight:600}
.tw{fill:var(--d-warn);font-size:12px;font-weight:600}
.tn{fill:var(--d-box);font-size:11px;font-weight:700}
.m{font-family:var(--d-mono)}
.arr{fill:none;stroke:var(--d-arrow);stroke-width:1.6}
.arra{fill:none;stroke:var(--d-acc);stroke-width:1.8}
.dash{stroke-dasharray:5 4}
.grid{stroke:var(--d-grid);stroke-width:1}
.area{fill:var(--d-accbg);stroke:var(--d-acc);stroke-width:2}
.head{fill:var(--d-arrow)}
.heada{fill:var(--d-acc)}
text{font-family:var(--d-font)}
</style><defs><marker id="agh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="aga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="heada"/></marker></defs><rect x="16" y="30" width="170" height="290" rx="12" class="zone"/><text x="30" y="56" class="th" text-anchor="start">Kluster k3d “lab”</text><rect x="26" y="72" width="150" height="48" rx="8" class="box"/><text x="101.0" y="93.0" class="th" text-anchor="middle">kube-state-metrics</text><text x="101.0" y="111.0" class="ts m" text-anchor="middle">NodePort :30081</text><path d="M176,96 H194 V151 H226" class="arra" marker-end="url(#aga)"/><rect x="26" y="132" width="150" height="48" rx="8" class="box"/><text x="101.0" y="153.0" class="th" text-anchor="middle">node-exporter</text><text x="101.0" y="171.0" class="ts m" text-anchor="middle">:9100</text><path d="M176,156 H194 V151 H226" class="arra" marker-end="url(#aga)"/><rect x="26" y="192" width="150" height="48" rx="8" class="box"/><text x="101.0" y="213.0" class="th" text-anchor="middle">cAdvisor</text><text x="101.0" y="231.0" class="ts" text-anchor="middle">melalui API server</text><path d="M176,216 H194 V151 H226" class="arra" marker-end="url(#aga)"/><rect x="26" y="252" width="150" height="48" rx="8" class="box"/><text x="101.0" y="273.0" class="th" text-anchor="middle">demo-app</text><text x="101.0" y="291.0" class="ts" text-anchor="middle">melalui API server</text><path d="M176,276 H194 V151 H226" class="arra" marker-end="url(#aga)"/><circle cx="194" cy="186" r="9" class="solid"/><text x="194" y="190" class="tn" text-anchor="middle">1</text><rect x="202" y="30" width="438" height="290" rx="12" class="zone2"/><text x="218" y="56" class="th" text-anchor="start">docker compose</text><text x="626" y="56" class="ts m" text-anchor="end">rangkaian monitoring</text><rect x="218" y="72" width="168" height="240" rx="8" class="acc"/><text x="302" y="94" class="th" text-anchor="middle">Prometheus</text><text x="302" y="112" class="ts m" text-anchor="middle">prometheus:9090</text><rect x="228" y="126" width="148" height="50" rx="8" class="box"/><text x="302.0" y="148.0" class="th" text-anchor="middle">Scrape (pull)</text><text x="302.0" y="166.0" class="ts" text-anchor="middle">ikut prometheus.yml</text><rect x="228" y="188" width="148" height="50" rx="8" class="box"/><text x="302.0" y="210.0" class="th" text-anchor="middle">TSDB</text><text x="302.0" y="228.0" class="ts" text-anchor="middle">siri masa, 7 hari</text><rect x="228" y="250" width="148" height="50" rx="8" class="box"/><text x="302.0" y="272.0" class="th" text-anchor="middle">HTTP API</text><text x="302.0" y="290.0" class="ts m" text-anchor="middle">/api/v1/query_range</text><path d="M302,176 V186" class="arr" marker-end="url(#agh)"/><path d="M302,238 V248" class="arr" marker-end="url(#agh)"/><circle cx="376" cy="188" r="9" class="solid"/><text x="376" y="192" class="tn" text-anchor="middle">2</text><rect x="462" y="72" width="164" height="240" rx="8" class="box"/><text x="544" y="94" class="th" text-anchor="middle">Grafana</text><text x="544" y="112" class="ts m" text-anchor="middle">localhost:3000</text><rect x="472" y="126" width="144" height="50" rx="8" class="okb"/><text x="544.0" y="148.0" class="th" text-anchor="middle">Data source</text><text x="544.0" y="166.0" class="ts m" text-anchor="middle">uid: prometheus</text><rect x="472" y="188" width="144" height="50" rx="8" class="okb"/><text x="544.0" y="210.0" class="th" text-anchor="middle">Dashboard</text><text x="544.0" y="228.0" class="ts" text-anchor="middle">dari fail JSON</text><rect x="472" y="250" width="144" height="50" rx="8" class="box"/><text x="544.0" y="272.0" class="th" text-anchor="middle">Panel</text><text x="544.0" y="290.0" class="ts" text-anchor="middle">query + paparan</text><path d="M544,238 V248" class="arr" marker-end="url(#agh)"/><path d="M472,151 H424 V275 H378" class="arra" marker-end="url(#aga)"/><text x="448" y="140" class="ta" text-anchor="middle">PromQL</text><circle cx="448" cy="151" r="9" class="solid"/><text x="448" y="155" class="tn" text-anchor="middle">4</text><path d="M378,290 H470" class="arr" marker-end="url(#agh)"/><text x="424" y="310" class="ts" text-anchor="middle">JSON</text><circle cx="424" cy="290" r="9" class="solid"/><text x="424" y="294" class="tn" text-anchor="middle">5</text><rect x="652" y="30" width="232" height="290" rx="12" class="zone"/><text x="666" y="56" class="th" text-anchor="start">Fail provisioning</text><circle cx="866" cy="51" r="9" class="solid"/><text x="866" y="55" class="tn" text-anchor="middle">3</text><rect x="660" y="72" width="216" height="118" rx="8" class="okb"/><text x="670" y="94" class="ts m" text-anchor="start">datasources/prometheus.yml</text><text x="670" y="114" class="ts m" text-anchor="start">name: Prometheus</text><text x="670" y="134" class="ts m" text-anchor="start">uid: prometheus</text><text x="670" y="154" class="ta m" text-anchor="start">url: http://prometheus:9090</text><text x="670" y="174" class="ts" text-anchor="start">(nama servis compose)</text><path d="M660,151 H618" class="arr" marker-end="url(#agh)"/><rect x="660" y="204" width="216" height="104" rx="8" class="okb"/><text x="670" y="226" class="ts m" text-anchor="start">dashboards/provider.yml</text><text x="670" y="246" class="ts" text-anchor="start">muat setiap *.json dari</text><text x="670" y="266" class="ts m" text-anchor="start">grafana/dashboards/</text><text x="670" y="286" class="ta m" text-anchor="start">bengkel-k8s-hpa.json</text><path d="M660,226 H646 V213 H618" class="arr" marker-end="url(#agh)"/><rect x="16" y="354" width="410" height="170" rx="12" class="zone"/><text x="32" y="378" class="tl" text-anchor="start">Langkah</text><circle cx="38" cy="398" r="9" class="solid"/><text x="38" y="402" class="tn" text-anchor="middle">1</text><text x="56" y="402" class="ts" text-anchor="start">Prometheus tarik (pull) /metrics setiap 15 s</text><circle cx="38" cy="418" r="9" class="solid"/><text x="38" y="422" class="tn" text-anchor="middle">2</text><text x="56" y="422" class="ts" text-anchor="start">Sampel disimpan sebagai siri masa dalam TSDB</text><circle cx="38" cy="438" r="9" class="solid"/><text x="38" y="442" class="tn" text-anchor="middle">3</text><text x="56" y="442" class="ts" text-anchor="start">Semasa mula, Grafana baca fail provisioning</text><circle cx="38" cy="458" r="9" class="solid"/><text x="38" y="462" class="tn" text-anchor="middle">4</text><text x="56" y="462" class="ts" text-anchor="start">Panel hantar PromQL ke /api/v1/query_range</text><circle cx="38" cy="478" r="9" class="solid"/><text x="38" y="482" class="tn" text-anchor="middle">5</text><text x="56" y="482" class="ts" text-anchor="start">Prometheus jawab JSON: senarai [masa, nilai]</text><circle cx="38" cy="498" r="9" class="solid"/><text x="38" y="502" class="tn" text-anchor="middle">6</text><text x="56" y="502" class="ts" text-anchor="start">Grafana lukis graf dalam pelayar</text><path d="M544,300 V352" class="arra" marker-end="url(#aga)"/><circle cx="544" cy="334" r="9" class="solid"/><text x="544" y="338" class="tn" text-anchor="middle">6</text><rect x="440" y="354" width="444" height="170" rx="12" class="zone2"/><text x="456" y="380" class="th" text-anchor="start">Pelayar anda</text><text x="456" y="400" class="ts m" text-anchor="start">localhost:3000</text><text x="456" y="432" class="ts" text-anchor="start">Refresh dashboard</text><text x="456" y="450" class="ts" text-anchor="start">setiap 10 s = ulang</text><text x="456" y="468" class="ts" text-anchor="start">langkah 4 hingga 6</text><rect x="604" y="368" width="266" height="142" rx="8" class="box"/><text x="616" y="388" class="ts" text-anchor="start">CPU pod vs requests &amp; limits</text><line x1="616" y1="420" x2="858" y2="420" class="grid"/><line 