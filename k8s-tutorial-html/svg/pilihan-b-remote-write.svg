</style><defs><marker id="pbh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="pba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="heada"/></marker></defs><rect x="560" y="30" width="320" height="170" rx="12" class="zone2"/><rect x="20" y="30" width="420" height="170" rx="12" class="zone"/><text x="36" y="56" class="th" text-anchor="start">Kluster</text><rect x="40" y="76" width="170" height="44" rx="8" class="box"/><text x="125.0" y="95.0" class="th" text-anchor="middle">Exporter</text><text x="125.0" y="113.0" class="ts" text-anchor="middle">ksm · node · cAdvisor</text><rect x="250" y="76" width="170" height="100" rx="8" class="acc"/><text x="335.0" y="123.0" class="th" text-anchor="middle">Prometheus Agent</text><text x="335.0" y="141.0" class="ts" text-anchor="middle">WAL bila rangkaian putus</text><path d="M210,98 H248" class="arr" marker-end="url(#pbh)"/><line x1="490" y1="20" x2="490" y2="210" class="arr dash"/><text x="484" y="214" class="tw" text-anchor="end">firewall: keluar sahaja</text><path d="M420,126 H600" class="arra" marker-end="url(#pba)"/><text x="510" y="116" class="ta m" text-anchor="middle">remote_write</text><text x="576" y="56" class="th" text-anchor="start">Luar kluster</text><rect x="602" y="100" width="120" height="52" rx="8" class="box"/><text x="662.0" y="123.0" class="th" text-anchor="middle">Prometheus</text><text x="662.0" y="141.0" class="ts" text-anchor="middle">terima tulis</text><rect x="744" y="100" width="120" height="52" rx="8" class="box"/><text x="804.0" y="131.0" class="th" text-anchor="middle">Grafana</text><path d="M744,126 H724" class="arr" marker-end="url(#pbh)"/></svg>