h d="M450,92 H790 V158" class="arr dash" marker-end="url(#kdh)"/><text x="620" y="84" class="ts" text-anchor="middle">scale 0 ↔ 1 (operator, setiap pollingInterval)</text><path d="M660,188 H718" class="arra" marker-end="url(#kda)"/><text x="689" y="180" class="ta" text-anchor="middle">1 ↔ N</text><path d="M590,216 V250 H452" class="arr" marker-end="url(#kdh)"/><text x="560" y="268" class="ts" text-anchor="middle">nilai s0-prometheus, setiap 15 s</text><path d="M350,222 V140" class="arr" marker-end="url(#kdh)"/><rect x="20" y="306" width="860" height="80" rx="10" class="zone"/><text x="40" y="332" class="tl" text-anchor="start">HPA biasa, metrik External, metricType AverageValue</text><text x="40" y="360" class="th m" text-anchor="start">desiredReplicas = ceil( nilai query / threshold )</text><text x="860" y="360" class="t" text-anchor="end">19 RPS / 5 → 4 pod</text></svg>