<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" role="img" aria-labelledby="klt kld" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="klt">Kelewatan reaksi HPA</title><desc id="kld">Garis masa 0 hingga 70 saat: resolusi Metrics Server 15 s, sync HPA 15 s, penjadualan dan pull image 1 hingga 30 s, start container dan readiness 3 hingga 10 s.</desc><style>svg{--d-zone:#f3f5f8;--d-zone2:#f8f6f1;--d-box:#ffffff;--d-line:#b9c2cf;--d-fg:#18202c;--d-muted:#5a6577;--d-acc:#2457c5;--d-accbg:#e6edfb;--d-warn:#b4540b;--d-warnbg:#fbeee2;--d-ok:#1f7a4d;--d-okbg:#e3f3ea;--d-arrow:#6b7688;--d-grid:#e1e5eb;--d-font:'IBM Plex Sans',system-ui,sans-serif;--d-mono:'IBM Plex Mono',ui-monospace,monospace}@media (prefers-color-scheme:dark){svg{--d-zone:#1a212c;--d-zone2:#211f1b;--d-box:#121821;--d-line:#3c4757;--d-fg:#e6eaf0;--d-muted:#9aa5b6;--d-acc:#7ea4ff;--d-accbg:#1d2a45;--d-warn:#f0a35e;--d-warnbg:#3a2717;--d-ok:#5fcf93;--d-okbg:#16301f;--d-arrow:#8b96a8;--d-grid:#2a3340}}
.zone{fill:var(--d-zone);stroke:var(--d-line);stroke-width:1.2}
.zone2{fill:var(--d-zone2);stroke:var(--d-line);stroke-width:1.2;stroke-dasharray:6 4}
.box{fill:var(--d-box);stroke:var(--d-line);stroke-width:1.2}
.acc{fill:var(--d-accbg);stroke:var(--d-acc);stroke-width:1.4}
.warn{fill:var(--d-warnbg);stroke:var(--d-warn);stroke-width:1.4}
.okb{fill:var(--d-okbg);stroke:var(--d-ok);stroke-width:1.4}
.solid{fill:var(--d-acc)}
.t{fill:var(--d-fg);font-size:14px}
.th{fill:var(--d-fg);font-size:14px;font-weight:600}
.ts{fill:var(--d-muted);font-size:12px}
.tl{fill:var(--d-muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.ta{fill:var(--d-acc);font-size:12px;font-weight:600}
.tw{fill:var(--d-warn);font-size:12px;font-weight:600}
.tn{fill:var(--d-box);font-size:11px;font-weight:700}
.m{font-family:var(--d-mono)}
.arr{fill:none;stroke:var(--d-arrow);stroke-width:1.6}
.arra{fill:none;stroke:var(--d-acc);stroke-width:1.8}
.dash{stroke-dasharray:5 4}
.grid{stroke:var(--d-grid);stroke-width:1}
.area{fill:var(--d-accbg);stroke:var(--d-acc);stroke-width:2}
.head{fill:var(--d-arrow)}
.heada{fill:var(--d-acc)}
text{font-family:var(--d-font)}
</style><defs><marker id="klh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="kla" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="heada"/></marker></defs><line x1="60" y1="70" x2="60" y2="170" class="grid"/><text x="60" y="190" class="ts m" text-anchor="middle">0 s</text><line x1="170" y1="70" x2="170" y2="170" class="grid"/><text x="170" y="190" class="ts m" text-anchor="middle">10 s</text><line x1="280" y1="70" x2="280" y2="170" class="grid"/><text x="280" y="190" class="ts m" text-anchor="middle">20 s</text><line x1="390" y1="70" x2="390" y2="170" class="grid"/><text x="390" y="190" class="ts m" text-anchor="middle">30 s</text><line x1="500" y1="70" x2="500" y2="170" class="grid"/><text x="500" y="190" class="ts m" text-anchor="middle">40 s</text><line x1="610" y1="70" x2="610" y2="170" class="grid"/><text x="610" y="190" class="ts m" text-anchor="middle">50 s</text><line x1="720" y1="70" x2="720" y2="170" class="grid"/><text x="720" y="190" class="ts m" text-anchor="middle">60 s</text><line x1="830" y1="70" x2="830" y2="170" class="grid"/><text x="830" y="190" class="ts m" text-anchor="middle">70 s</text><rect x="61" y="90" width="163" height="44" rx="6" class="box"/><text x="142.5" y="82" class="ts" text-anchor="middle">Metrics Server</text><text x="142.5" y="117" class="th m" text-anchor="middle">~15 s</text><rect x="226" y="90" width="163" height="44" rx="6" class="box"/><text x="307.5" y="82" class="ts" text-anchor="middle">Sync HPA</text><text x="307.5" y="117" class="th m" text-anchor="middle">~15 s</text><rect x="391" y="90" width="108" height="44" rx="6" class="warn"/><text x="445.0" y="82" class="ts" text-anchor="middle">Jadual + image</text><text x="445.0" y="117" class="th m" text-anchor="middle">1–30 s</text><rect x="501" y="90" width="86" height="44" rx="6" class="acc"/><text x="544.0" y="82" class="ts" text-anchor="middle">Start + ready</text><text x="544.0" y="117" class="ts m" text-anchor="middle">3–10 s</text><rect x="391" y="142" width="330" height="10" rx="3" class="warn"/><text x="731" y="151" class="tw" text-anchor="start">jadual + image tanpa cache</text><path d="M588,60 V88" class="arra" marker-end="url(#kla)"/><text x="596" y="58" class="ta" text-anchor="start">pod baharu mula terima trafik (≈ 30–70 s)</text><text x="60" y="28" class="th" text-anchor="start">Kenapa HPA tidak serta-merta: jumlah kelewatan sebelum pod baharu melayan request</text><text x="60" y="214" class="ts" text-anchor="start">Implikasi: minReplicas mesti cukup untuk menampung lonjakan pertama.</text></svg>