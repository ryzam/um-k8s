text{font-family:var(--d-font)}
</style><defs><marker id="moh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="moa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="heada"/></marker></defs><rect x="20" y="40" width="290" height="360" rx="12" class="zone2"/><text x="36" y="66" class="th" text-anchor="start">Luar kluster</text><text x="294" y="66" class="ts m" text-anchor="end">docker compose</text><rect x="44" y="92" width="242" height="52" rx="8" class="acc"/><text x="165.0" y="115.0" class="th" text-anchor="middle">Prometheus</text><text x="165.0" y="133.0" class="ts" text-anchor="middle">scrape + alert rules</text><rect x="44" y="196" width="242" height="44" rx="8" class="box"/><text x="165.0" y="223.0" class="th" text-anchor="middle">Alertmanager</text><path d="M165,144 V194" class="arr" marker-end="url(#moh)"/><rect x="44" y="272" width="74" height="36" rx="8" class="okb"/><text x="81.0" y="295.0" class="ts" text-anchor="middle">Email</text><path d="M81,240 V270" class="arr" marker-end="url(#moh)"/><rect x="128" y="272" width="74" height="36" rx="8" class="okb"/><text x="165.0" y="295.0" class="ts" text-anchor="middle">Slack</text><path d="M165,240 V270" class="arr" marker-end="url(#moh)"/><rect x="212" y="272" width="74" height="36" rx="8" class="okb"/><text x="249.0" y="295.0" class="ts" text-anchor="middle">Teams</text><path d="M249,240 V270" class="arr" marker-end="url(#moh)"/><rect x="44" y="334" width="242" height="46" rx="8" class="box"/><text x="165.0" y="354.0" class="th" text-anchor="middle">Grafana</text><text x="165.0" y="372.0" class="ts" text-anchor="middle">dashboard + alert Grafana</text><path d="M44,357 H32 V118 H42" class="arr" marker-end="url(#moh)"/><rect x="370" y="40" width="510" height="360" rx="12" class="zone"/><text x="386" y="66" class="th" text-anchor="start">Kluster k3d “lab”</text><rect x="392" y="92" width="200" height="52" rx="8" class="box"/><text x="492.0" y="115.0" class="th" text-anchor="middle">API server :6443</text><text x="492.0" y="133.0" class="ts" text-anchor="middle">token SA prometheus-external</text><rect x="652" y="84" width="208" height="42" rx="8" class="box"/><text x="756.0" y="102.0" class="th" text-anchor="middle">kubelet / cAdvisor</text><text x="756.0" y="120.0" class="ts" text-anchor="middle">setiap node</text><rect x="652" y="140" width="208" height="42" rx="8" class="box"/><text x="756.0" y="158.0" class="th" text-anchor="middle">pod demo-app</text><text x="756.0" y="176.0" class="ts m" text-anchor="middle">:8080/metrics</text><path d="M592,110 H650" class="arr" marker-end="url(#moh)"/><path d="M592,126 H620 V161 H650" class="arr" marker-end="url(#moh)"/><text x="621" y="102" class="ts" text-anchor="middle">proxy</text><rect x="392" y="210" width="200" height="52" rx="8" class="box"/><text x="492.0" y="233.0" class="th" text-anchor="middle">kube-state-metrics</text><text x="492.0" y="251.0" class="ts" text-anchor="middle">NodePort 30081</text><rect x="392" y="300" width="200" height="52" rx="8" class="box"/><text x="492.0" y="323.0" class="th" text-anchor="middle">node-exporter</text><text x="492.0" y="341.0" class="ts" text-anchor="middle">DaemonSet · hostNetwork :9100</text><path d="M286,112 H390" class="arra" marker-end="url(#moa)"/><path d="M286,124 H340 V236 H390" class="arra" marker-end="url(#moa)"/><path d="M286,132 H328 V326 H390" class="arra" marker-end="url(#moa)"/><text x="338" y="104" class="ta" text-anchor="middle">scrape</text><rect x="652" y="210" width="208" height="142" rx="8" class="box"/><text x="668" y="234" class="th" text-anchor="start">RBAC least privilege</text><text x="668" y="260" class="ts m" text-anchor="start">✓ get nodes/proxy</text><text x="668" y="282" class="ts m" text-anchor="start">✓ get pods/proxy</text><text x="668" y="304" class="ts m" text-anchor="start">✗ delete pods</text><text x="668" y="326" class="ts m" text-anchor="start">✗ get secrets</text></svg>