.area{fill:var(--d-accbg);stroke:var(--d-acc);stroke-width:2}
.head{fill:var(--d-arrow)}
.heada{fill:var(--d-acc)}
text{font-family:var(--d-font)}
</style><defs><marker id="dgh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="dga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="heada"/></marker></defs><rect x="20" y="186" width="200" height="66" rx="8" class="acc"/><text x="120.0" y="216.0" class="th m" text-anchor="middle">kubectl get pods</text><text x="120.0" y="234.0" class="ts" text-anchor="middle">STATUS dan RESTARTS?</text><line x1="240" y1="54" x2="240" y2="384" class="arr"/><path d="M220,219 H240" class="arr"/><path d="M240,54 H268" class="arr" marker-end="url(#dgh)"/><rect x="270" y="30" width="230" height="48" rx="8" class="warn"/><text x="385.0" y="59.0" class="ts m" text-anchor="middle">Pending</text><path d="M500,54 H518" class="arr" marker-end="url(#dgh)"/><rect x="520" y="30" width="370" height="48" rx="8" class="box"/><text x="534" y="50" class="ts m" text-anchor="start">describe pod → Events: FailedScheduling</text><text x="534" y="68" class="ts" text-anchor="start">resource, nodeSelector, taint, PVC</text><path d="M240,122 H268" class="arr" marker-end="url(#dgh)"/><rect x="270" y="98" width="230" height="48" rx="8" class="warn"/><text x="385.0" y="127.0" class="ts m" text-anchor="middle">ImagePullBackOff</text><path d="M500,122 H518" class="arr" marker-end="url(#dgh)"/><rect x="520" y="98" width="370" height="48" rx="8" class="box"/><text x="534" y="118" class="ts m" text-anchor="start">describe pod → Events</text><text x="534" y="136" class="ts" text-anchor="start">nama image/tag, registry, imagePullSecrets</text><path d="M240,190 H268" class="arr" marker-end="url(#dgh)"/><rect x="270" y="166" width="230" height="48" rx="8" class="warn"/><text x="385.0" y="195.0" class="ts m" text-anchor="middle">CreateContainerConfigError</text><path d="M500,190 H518" class="arr" marker-end="url(#dgh)"/><rect x="520" y="166" width="370" height="48" rx="8" class="box"/><text x="534" y="186" class="ts m" text-anchor="start">describe pod</text><text x="534" y="204" class="ts" text-anchor="start">ConfigMap / Secret / key yang hilang</text><path d="M240,258 H268" class="arr" marker-end="url(#dgh)"/><rect x="270" y="234" width="230" height="48" rx="8" class="warn"/><text x="385.0" y="263.0" class="ts m" text-anchor="middle">CrashLoopBackOff</text><path d="M500,258 H518" class="arr" marker-end="url(#dgh)"/><rect x="520" y="234" width="370" height="48" rx="8" class="box"/><text x="534" y="254" class="ts m" text-anchor="start">logs --previous · describe → Last State</text><text x="534" y="272" class="ts" text-anchor="start">exit 1 app · 137 SIGKILL (OOM/liveness) · 143 SIGTERM</text><path d="M240,326 H268" class="arr" marker-end="url(#dgh)"/><rect x="270" y="302" width="230" height="48" rx="8" class="box"/><text x="385.0" y="331.0" class="ts m" text-anchor="middle">Running 0/1</text><path d="M500,326 H518" class="arr" marker-end="url(#dgh)"/><rect x="520" y="302" width="370" height="48" rx="8" class="box"/><text x="534" y="322" class="ts m" text-anchor="start">readinessProbe gagal</text><text x="534" y="340" class="ts" text-anchor="start">describe → Events: Readiness probe failed</text><path d="M240,394 H268" class="arr" marker-end="url(#dgh)"/><rect x="270" y="370" width="230" height="48" rx="8" class="box"/><text x="385.0" y="399.0" class="ts m" text-anchor="middle">Running 1/1, Service gagal</text><path d="M500,394 H518" class="arr" marker-end="url(#dgh)"/><rect x="520" y="370" width="370" height="48" rx="8" class="box"/><text x="534" y="390" class="ts m" text-anchor="start">get endpointslices</text><text x="534" y="408" class="ts" text-anchor="start">semak selector dan targetPort</text></svg>